name: Poolmanager monitor 

on:
  schedule:
    - cron: "*/5 * * * *"   # elke 5 minuten (GitHub kan wat later starten)
    - cron: "2 10,11,16,17 * * *"  # overzicht om 12:00 en 18:00 NL-tijd (zomer- en wintertijd)
  workflow_dispatch:        # handmatig starten via het tabblad Actions
    inputs:
      overzicht:
        description: "Ook het overzicht versturen"
        type: boolean
        default: false

permissions:
  contents: write           # nodig om seen.json op te slaan
  actions: read             # nodig om het aantal controles te tellen

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kalender controleren
        env:
          POOLMANAGER_USERNAME: ${{ secrets.POOLMANAGER_USERNAME }}
          POOLMANAGER_PASSWORD: ${{ secrets.POOLMANAGER_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          SUMMARY_SLOT: ${{ github.event.schedule == '2 10,11,16,17 * * *' }}
          FORCE_SUMMARY: ${{ inputs.overzicht }}
        run: python monitor.py

      - name: Gezien-lijst opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Gezien-lijst bijgewerkt" && git push)
