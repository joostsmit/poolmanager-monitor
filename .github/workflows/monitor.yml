name: Poolmanager monitor 

on:
  schedule:
    - cron: "*/4 * * * *"   # reserve; GitHub slaat veel runs over. cron-job.org start hem elke 4 minuten.
  workflow_dispatch:        # handmatig starten via het tabblad Actions
    inputs:
      overzicht:
        description: "Ook het overzicht versturen"
        type: boolean
        default: false
      testmelding:
        description: "Testmelding versturen (zelfde prioriteit als een nieuwe opdracht)"
        type: boolean
        default: false

permissions:
  contents: write           # nodig om seen.json op te slaan
  actions: read             # nodig om het aantal controles te tellen

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kalender controleren
        env:
          POOLMANAGER_USERNAME: ${{ secrets.POOLMANAGER_USERNAME }}
          POOLMANAGER_PASSWORD: ${{ secrets.POOLMANAGER_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_SUMMARY: ${{ inputs.overzicht }}
          TEST_NOTIFICATION: ${{ inputs.testmelding }}
          PUSHOVER_EMERGENCY: ${{ vars.PUSHOVER_EMERGENCY }}
          CRON_TOKEN_EXPIRES: ${{ vars.CRON_TOKEN_EXPIRES }}  # Variable JJJJ-MM-DD: waarschuwing in overzicht  # Variable 'true' = herhalende noodmelding
        run: python monitor.py

      - name: Gezien-lijst opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json last_summary.txt 2>/dev/null || git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Gezien-lijst bijgewerkt"
          # Is main intussen gewijzigd (bijv. door een handmatige aanpassing)? Dan eerst bijwerken en opnieuw proberen.
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q || exit 1; done
          exit 1
